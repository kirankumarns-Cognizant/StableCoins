# Shared connection configuration. Packaged into all six services.
# Environment variables override defaults. Never put credential values here.
# An external properties file can override any setting via CONNECTIONS_CONFIG=file:/path/file.properties.

# PostgreSQL / Aurora. Inject DB_PASSWORD from a secret at deployment time.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stablecoin_poc}}
spring.datasource.username=${DB_USER:${DB_USERNAME:stablecoin}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# AWS: blank endpoint means real AWS; credentials then use the SDK default chain / ECS task role.
connections.aws.endpoint=${LOCALSTACK_URL:}
connections.aws.account-id=${LOCALSTACK_ACCOUNT_ID:000000000000}
connections.aws.region=${AWS_REGION:us-east-1}
connections.aws.local-access-key=${AWS_ACCESS_KEY_ID:test}
connections.aws.local-secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.cloud.aws.region.static=${connections.aws.region}
spring.cloud.aws.sqs.endpoint=${connections.aws.endpoint}
app.eventbridge.bus-name=${EVENTBRIDGE_BUS_NAME:stablecoin-payment-bus}
app.sqs.payment-created-queue-name=${SQS_PAYMENT_CREATED_QUEUE_NAME:stablecoin-payment-created-queue}
app.sqs.compliance-completed-queue-name=${SQS_COMPLIANCE_COMPLETED_QUEUE_NAME:stablecoin-compliance-completed-queue}
app.sqs.blockchain-submitted-queue-name=${SQS_BLOCKCHAIN_SUBMITTED_QUEUE_NAME:stablecoin-blockchain-submitted-queue}
app.sqs.blockchain-confirmed-queue-name=${SQS_BLOCKCHAIN_CONFIRMED_QUEUE_NAME:stablecoin-blockchain-confirmed-queue}
app.sqs.payment-created-dlq-name=${SQS_PAYMENT_CREATED_DLQ_NAME:stablecoin-payment-created-dlq}
app.sqs.compliance-completed-dlq-name=${SQS_COMPLIANCE_COMPLETED_DLQ_NAME:stablecoin-compliance-completed-dlq}

# Review notifications only; no financial execution consumer.
app.sqs.routing-decisions-queue-name=${SQS_ROUTING_DECISIONS_QUEUE_NAME:stablecoin-routing-decisions-queue}
app.sqs.routing-decisions-dlq-name=${SQS_ROUTING_DECISIONS_DLQ_NAME:stablecoin-routing-decisions-dlq}

# Base Sepolia preferred. Explicitly replace the complete network tuple for Ethereum Sepolia.
# No automatic failover after an uncertain submission.
blockchain.mode=${BLOCKCHAIN_MODE:MOCK}
blockchain.network=${BLOCKCHAIN_NETWORK:base-sepolia}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:84532}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.mock-rpc-url=${BLOCKCHAIN_MOCK_RPC_URL:http://localhost:8545}
blockchain.rpc-connect-timeout-ms=${BLOCKCHAIN_RPC_CONNECT_TIMEOUT_MS:10000}
blockchain.rpc-read-timeout-ms=${BLOCKCHAIN_RPC_READ_TIMEOUT_MS:30000}
blockchain.token-contract=${BLOCKCHAIN_TOKEN_CONTRACT:0x036CbD53842c5426634e7929541eC2318f3dCF7e}
blockchain.token-symbol=${BLOCKCHAIN_TOKEN_SYMBOL:USDC}
blockchain.token-decimals=${BLOCKCHAIN_TOKEN_DECIMALS:6}
blockchain.explorer-base-url=${BLOCKCHAIN_EXPLORER_BASE_URL:${BLOCKCHAIN_EXPLORER_URL:https://sepolia.basescan.org}}
blockchain.confirmations-required=${BLOCKCHAIN_CONFIRMATIONS_REQUIRED:1}
blockchain.wallet-secret-name=${BLOCKCHAIN_WALLET_SECRET_NAME:}
testnet.enabled=${TESTNET_ENABLED:false}

# Internal HTTP destinations: contracts for upcoming clients; do not bypass the event flow.
connections.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8080}
connections.services.compliance-quote-url=${COMPLIANCE_QUOTE_SERVICE_URL:http://localhost:8081}
connections.services.blockchain-url=${BLOCKCHAIN_SERVICE_URL:http://localhost:8082}
connections.services.ledger-url=${SETTLEMENT_LEDGER_SERVICE_URL:http://localhost:8083}
connections.services.reconciliation-url=${RECONCILIATION_SERVICE_URL:http://localhost:8084}
connections.visa.base-url=${VISA_SIMULATOR_INTERNAL_URL:http://localhost:8086}
visa.simulator.mode=SIMULATOR

# Identity contract: active in payment-service. Cognito remains the accepted provider.
# payment-service verifies Cognito JWTs; missing identity configuration denies API access.
# Customer membership/roles are server-owned app.access configuration, never identity headers.
connections.identity.provider=${IDENTITY_PROVIDER:COGNITO}
connections.identity.issuer-uri=${IDENTITY_ISSUER_URI:${COGNITO_ISSUER_URI:}}
connections.identity.jwk-set-uri=${IDENTITY_JWK_SET_URI:}
connections.identity.http-timeout-ms=${IDENTITY_HTTP_TIMEOUT_MS:5000}
connections.identity.audience=${IDENTITY_AUDIENCE:}
connections.identity.client-id=${IDENTITY_CLIENT_ID:${COGNITO_APP_CLIENT_ID:}}
connections.identity.service-client-id=${IDENTITY_SERVICE_CLIENT_ID:}
connections.identity.service-scope=${IDENTITY_SERVICE_SCOPE:stablecoins/internal}
connections.identity.authorization-uri=${IDENTITY_AUTHORIZATION_URI:}
connections.identity.token-uri=${IDENTITY_TOKEN_URI:}
connections.identity.redirect-uri=${IDENTITY_REDIRECT_URI:http://localhost:5173/auth/callback}
connections.identity.scopes=${IDENTITY_SCOPES:openid profile}

# OpenAI Responses API; payment-service only. Disabled until customer/model/secret/pricing are explicitly configured.
connections.ai.provider=${AI_PROVIDER:OPENAI}
connections.ai.auth-mode=${AI_AUTH_MODE:SECRET_BEARER}
connections.ai.region=${AI_REGION:${connections.aws.region}}
connections.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
connections.ai.model=${AI_MODEL:}
connections.ai.api-key-secret-name=${AI_API_KEY_SECRET_NAME:}
connections.ai.timeout-ms=${AI_TIMEOUT_MS:30000}

# Explicit browser allowlist. Never add private endpoints, RPC credentials or secrets.
public.api-base-url=${PUBLIC_API_BASE_URL:/api/v1}
public.identity-issuer-uri=${connections.identity.issuer-uri}
public.identity-client-id=${connections.identity.client-id}
public.identity-redirect-uri=${connections.identity.redirect-uri}
public.identity-scopes=${connections.identity.scopes}

# Deterministic assessment baseline (server-owned). Change version whenever scoring/gating rules change.
app.routing.assessment.version=${ROUTING_ASSESSMENT_VERSION:baseline-v1}
app.routing.assessment.maximum-evidence-age=${ROUTING_MAXIMUM_EVIDENCE_AGE:PT5M}
app.routing.assessment.historical-window=${ROUTING_HISTORICAL_WINDOW:PT24H}
app.routing.assessment.minimum-sample-size=${ROUTING_MINIMUM_SAMPLE_SIZE:100}
app.routing.assessment.latency-percentile=${ROUTING_LATENCY_PERCENTILE:95}
app.routing.assessment.minimum-success-rate=${ROUTING_MINIMUM_SUCCESS_RATE:0.95}
app.routing.assessment.maximum-fraud-score=${ROUTING_MAXIMUM_FRAUD_SCORE:30}
app.routing.assessment.maximum-price-deviation-bps=${ROUTING_MAXIMUM_PRICE_DEVIATION_BPS:100}
app.routing.assessment.maximum-candidates=${ROUTING_MAXIMUM_CANDIDATES:20}
app.routing.assessment.maximum-observations=${ROUTING_MAXIMUM_OBSERVATIONS:200}

# Deterministic treasury readiness/reservations. ETH allowance covers uncertainty, not an L1-fee quote.
blockchain.reservation-ttl=${BLOCKCHAIN_RESERVATION_TTL:PT5M}
blockchain.readiness-ttl=${BLOCKCHAIN_READINESS_TTL:PT30S}
blockchain.gas-limit-multiplier=${BLOCKCHAIN_GAS_LIMIT_MULTIPLIER:1.2}
blockchain.gas-price-multiplier=${BLOCKCHAIN_GAS_PRICE_MULTIPLIER:1.2}
blockchain.additional-gas-reserve-eth=${BLOCKCHAIN_ADDITIONAL_GAS_RESERVE_ETH:0.00001}
# Enable only behind the protected internal service boundary. This switch is not authentication.
blockchain.execution-api-enabled=${BLOCKCHAIN_EXECUTION_API_ENABLED:false}
visa.simulator.allowed-provider-ids=${VISA_SIMULATOR_ALLOWED_PROVIDER_IDS:SIMULATED-PROVIDER-A,SIMULATED-PROVIDER-B}
visa.simulator.reservation-ttl=${VISA_SIMULATOR_RESERVATION_TTL:PT5M}

# Bounded read-only agent. Pricing is a deployment assumption, not measured billing.
app.agent.enabled=${ROUTING_AGENT_ENABLED:false}
app.agent.allowed-customer-ids=${ROUTING_AGENT_ALLOWED_CUSTOMER_IDS:}
app.agent.maximum-rounds=${ROUTING_AGENT_MAXIMUM_ROUNDS:12}
app.agent.maximum-tool-calls=${ROUTING_AGENT_MAXIMUM_TOOL_CALLS:24}
app.agent.maximum-output-tokens=${ROUTING_AGENT_MAXIMUM_OUTPUT_TOKENS:4096}
app.agent.maximum-total-tokens=${ROUTING_AGENT_MAXIMUM_TOTAL_TOKENS:250000}
app.agent.maximum-request-bytes=${ROUTING_AGENT_MAXIMUM_REQUEST_BYTES:65536}
app.agent.maximum-response-bytes=${ROUTING_AGENT_MAXIMUM_RESPONSE_BYTES:131072}
app.agent.maximum-concurrent-runs=${ROUTING_AGENT_MAXIMUM_CONCURRENT_RUNS:2}
app.agent.maximum-runs-per-payment=${ROUTING_AGENT_MAXIMUM_RUNS_PER_PAYMENT:10}
app.agent.deadline-ms=${ROUTING_AGENT_DEADLINE_MS:90000}
app.agent.maximum-inference-cost-usd=${ROUTING_AGENT_MAXIMUM_INFERENCE_COST_USD:1.00}
app.agent.input-usd-per-million=${ROUTING_AGENT_INPUT_USD_PER_MILLION:0}
app.agent.output-usd-per-million=${ROUTING_AGENT_OUTPUT_USD_PER_MILLION:0}

# Accepted ADR-015 accounting policy; private server configuration only.
app.ledger.accounting.version=${LEDGER_ACCOUNTING_POLICY_VERSION:adr015-v1}
app.ledger.accounting.accounts.corporate-usd=${LEDGER_ACCOUNT_CORPORATE_USD:110001}
app.ledger.accounting.accounts.funding-usd=${LEDGER_ACCOUNT_FUNDING_USD:110002}
app.ledger.accounting.accounts.conversion-usd=${LEDGER_ACCOUNT_CONVERSION_USD:110003}
app.ledger.accounting.accounts.allocation-usdc=${LEDGER_ACCOUNT_ALLOCATION_USDC:220001}
app.ledger.accounting.accounts.treasury-usdc=${LEDGER_ACCOUNT_TREASURY_USDC:120001}
app.ledger.accounting.accounts.transit-usdc=${LEDGER_ACCOUNT_TRANSIT_USDC:120002}
app.ledger.accounting.accounts.beneficiary-usdc=${LEDGER_ACCOUNT_BENEFICIARY_USDC:120003}
app.ledger.accounting.accounts.gas-expense-eth=${LEDGER_ACCOUNT_GAS_EXPENSE_ETH:510001}
app.ledger.accounting.accounts.gas-clearing-eth=${LEDGER_ACCOUNT_GAS_CLEARING_ETH:130001}
app.ledger.accounting.accounts.provider-usd=${LEDGER_ACCOUNT_PROVIDER_USD:110004}
app.ledger.accounting.accounts.payable-usd=${LEDGER_ACCOUNT_PAYABLE_USD:210001}
app.ledger.accounting.accounts.provider-inr=${LEDGER_ACCOUNT_PROVIDER_INR:140001}
app.ledger.accounting.accounts.payable-inr=${LEDGER_ACCOUNT_PAYABLE_INR:240001}
app.ledger.manual-api-enabled=${LEDGER_MANUAL_API_ENABLED:false}

# Trusted accounting events; version-2 funding requires bound quote terms.
app.sqs.ledger-funding-queue-name=${SQS_LEDGER_FUNDING_QUEUE_NAME:stablecoin-ledger-funding-queue}
app.sqs.ledger-funding-dlq-name=${SQS_LEDGER_FUNDING_DLQ_NAME:stablecoin-ledger-funding-dlq}
app.sqs.blockchain-submitted-dlq-name=${SQS_BLOCKCHAIN_SUBMITTED_DLQ_NAME:stablecoin-blockchain-submitted-dlq}
app.sqs.blockchain-confirmed-dlq-name=${SQS_BLOCKCHAIN_CONFIRMED_DLQ_NAME:stablecoin-blockchain-confirmed-dlq}

# Step 7 durable flow. Simulation values are demonstrator assumptions, not observed performance.
app.flow.enabled=${PAYMENT_FLOW_ENABLED:false}
app.flow.execution-enabled=${PAYMENT_EXECUTION_ENABLED:false}
app.flow.poll-ms=${PAYMENT_FLOW_POLL_MS:3000}
app.flow.simulation.version=${FLOW_SIMULATION_VERSION:simulation-v1}
app.flow.simulation.provider-ids=${FLOW_SIMULATION_PROVIDER_IDS:SIMULATED-PROVIDER-A,SIMULATED-PROVIDER-B}
app.flow.simulation.quote-ttl=${FLOW_QUOTE_TTL:PT5M}
app.flow.simulation.fee-usd=${FLOW_SIMULATED_FEE_USD:2.00}
app.flow.simulation.completed=${FLOW_SIMULATED_COMPLETED:990}
app.flow.simulation.attempts=${FLOW_SIMULATED_ATTEMPTS:1000}
app.flow.simulation.latency-ms=${FLOW_SIMULATED_LATENCY_MS:120000}
app.flow.simulation.fraud-score=${FLOW_SIMULATED_FRAUD_SCORE:10}
app.flow.simulation.available=${FLOW_SIMULATED_AVAILABLE:true}
app.flow.simulation.eth-usd-budget=${FLOW_SIMULATED_ETH_USD_BUDGET:2000}
app.sqs.flow-quote-queue-name=${SQS_FLOW_QUOTE_QUEUE_NAME:stablecoin-flow-quote-queue}
app.sqs.flow-quote-dlq-name=${SQS_FLOW_QUOTE_DLQ_NAME:stablecoin-flow-quote-dlq}
app.sqs.flow-treasury-queue-name=${SQS_FLOW_TREASURY_QUEUE_NAME:stablecoin-flow-treasury-queue}
app.sqs.flow-treasury-dlq-name=${SQS_FLOW_TREASURY_DLQ_NAME:stablecoin-flow-treasury-dlq}
app.sqs.flow-validation-queue-name=${SQS_FLOW_VALIDATION_QUEUE_NAME:stablecoin-flow-validation-queue}
app.sqs.flow-validation-dlq-name=${SQS_FLOW_VALIDATION_DLQ_NAME:stablecoin-flow-validation-dlq}
app.sqs.flow-reservation-queue-name=${SQS_FLOW_RESERVATION_QUEUE_NAME:stablecoin-flow-reservation-queue}
app.sqs.flow-reservation-dlq-name=${SQS_FLOW_RESERVATION_DLQ_NAME:stablecoin-flow-reservation-dlq}
app.sqs.flow-submission-queue-name=${SQS_FLOW_SUBMISSION_QUEUE_NAME:stablecoin-flow-submission-queue}
app.sqs.flow-submission-dlq-name=${SQS_FLOW_SUBMISSION_DLQ_NAME:stablecoin-flow-submission-dlq}
app.flow.preparation-timeout-seconds=${PAYMENT_FLOW_PREPARATION_TIMEOUT_SECONDS:120}

# Receipt polling must not occupy the only outbox/continuation scheduling thread.
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:4}

# Per-provider overrides: provider A inherits the global simulation settings above.
app.flow.simulation.providers.SIMULATED-PROVIDER-B.fee-usd=${FLOW_PROVIDER_B_FEE_USD:5.00}
app.flow.simulation.providers.SIMULATED-PROVIDER-B.latency-ms=${FLOW_PROVIDER_B_LATENCY_MS:60000}
app.flow.simulation.providers.SIMULATED-PROVIDER-B.available=${FLOW_PROVIDER_B_AVAILABLE:true}

# Step 8: explicit simulated destination FX and payout operations. No real bank/Visa connection.
app.flow.simulation.fx-usd=${FLOW_SIMULATED_FX_USD:1.00}
app.flow.simulation.fx-inr=${FLOW_SIMULATED_FX_INR:83.00}
visa.simulator.payout-scenario=${VISA_SIMULATOR_PAYOUT_SCENARIO:SUCCEEDED}
visa.simulator.operations-enabled=${VISA_SIMULATOR_OPERATIONS_ENABLED:false}
app.sqs.receipt-observed-queue-name=${SQS_RECEIPT_OBSERVED_QUEUE_NAME:stablecoin-receipt-observed-queue}
app.sqs.receipt-observed-dlq-name=${SQS_RECEIPT_OBSERVED_DLQ_NAME:stablecoin-receipt-observed-dlq}
app.sqs.settlement-requested-queue-name=${SQS_SETTLEMENT_REQUESTED_QUEUE_NAME:stablecoin-settlement-requested-queue}
app.sqs.settlement-requested-dlq-name=${SQS_SETTLEMENT_REQUESTED_DLQ_NAME:stablecoin-settlement-requested-dlq}
app.sqs.visa-payout-queue-name=${SQS_VISA_PAYOUT_QUEUE_NAME:stablecoin-visa-payout-queue}
app.sqs.visa-payout-dlq-name=${SQS_VISA_PAYOUT_DLQ_NAME:stablecoin-visa-payout-dlq}
app.sqs.ledger-payout-queue-name=${SQS_LEDGER_PAYOUT_QUEUE_NAME:stablecoin-ledger-payout-queue}
app.sqs.ledger-payout-dlq-name=${SQS_LEDGER_PAYOUT_DLQ_NAME:stablecoin-ledger-payout-dlq}
app.sqs.reconciliation-requested-queue-name=${SQS_RECONCILIATION_REQUESTED_QUEUE_NAME:stablecoin-reconciliation-requested-queue}
app.sqs.reconciliation-requested-dlq-name=${SQS_RECONCILIATION_REQUESTED_DLQ_NAME:stablecoin-reconciliation-requested-dlq}

public.identity-authorization-uri=${connections.identity.authorization-uri}
public.identity-token-uri=${connections.identity.token-uri}

# Development host allowlist is server-only; use the exact forwarded Codespaces host.
frontend.dev.allowed-hosts=${FRONTEND_DEV_ALLOWED_HOSTS:}

# Public chain metadata only; RPC credentials remain server-only.
public.blockchain-chain-id=${blockchain.chain-id}
public.blockchain-explorer-base-url=${blockchain.explorer-base-url}

# Local-only validation scripts. These settings never enter the browser bundle.
local.validation.health-timeout-ms=${LOCAL_VALIDATION_HEALTH_TIMEOUT_MS:10000}
local.validation.compose-wait-seconds=${LOCAL_START_WAIT_SECONDS:600}
local.validation.frontend-start-timeout-ms=${LOCAL_FRONTEND_START_TIMEOUT_MS:30000}

# Dedicated local shared-schema bootstrap only. Production remains fail-closed.
spring.flyway.baseline-on-migrate=${LOCAL_SCHEMA_BOOTSTRAP:false}
spring.flyway.baseline-version=0
