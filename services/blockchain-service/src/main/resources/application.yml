spring:
  config:
    import: "classpath:connections.properties,${CONNECTIONS_CONFIG:optional:file:./config/connections-local.properties}"
  application:
    name: blockchain-service
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_blockchain
app:
  besu:
    enabled: ${BESU_PRIVATE_DEMO_ENABLED:false}
  outbox:
    poll-interval-ms: 5000
  eventbridge:
    source: stablecoins.blockchain-service

server:
  port: ${BLOCKCHAIN_SERVICE_PORT:8082}

logging:
  level:
    com.cognizant.stablecoins: ${LOG_LEVEL:INFO}
