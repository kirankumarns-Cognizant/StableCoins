spring:
  config:
    import: "classpath:connections.properties,${CONNECTIONS_CONFIG:optional:file:./config/connections-local.properties}"
  application:
    name: settlement-ledger-service
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_ledger
server:
  port: ${SETTLEMENT_LEDGER_SERVICE_PORT:8083}

logging:
  level:
    com.cognizant.stablecoins: ${LOG_LEVEL:INFO}
