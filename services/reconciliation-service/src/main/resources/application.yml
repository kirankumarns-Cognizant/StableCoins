spring:
  config:
    import: "classpath:connections.properties,${CONNECTIONS_CONFIG:optional:file:./config/connections-local.properties}"
  application:
    name: reconciliation-service
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_reconciliation

server:
  port: ${RECONCILIATION_SERVICE_PORT:8084}
