    CONNECTIONS_CONFIG: file:/app/config/connections.properties
  volumes:
    - ${CONNECTIONS_CONFIG_FILE:-./services/config/connections.properties}:/app/config/connections.properties:ro
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
  restart: on-failure

services:

  # â”€â”€ Infrastructure â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  postgres:
    image: postgres:16-alpine
    container_name: stablecoins-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stablecoin_poc}
      POSTGRES_USER: ${DB_USERNAME:-stablecoin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stablecoins-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stablecoin} -d ${DB_NAME:-stablecoin_poc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    image: localstack/localstack:3
    container_name: stablecoins-localstack
    environment:
      SERVICES: sqs,events
      DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - stablecoins-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # â”€â”€ Application services (profile: services) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Images are built from services/ using the per-service Dockerfiles.
  # Build command: docker compose --profile services up --build

  payment-service:
    build:
      context: ./services
      dockerfile: payment-service/Dockerfile
    image: stablecoins/payment-service:latest
    container_name: stablecoins-payment-service
    profiles: [services]
    <<: *service-common
    ports:
      - "127.0.0.1:${PAYMENT_SERVICE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  compliance-quote-service:
    build:
      context: ./services
      dockerfile: compliance-quote-service/Dockerfile
    image: stablecoins/compliance-quote-service:latest
    container_name: stablecoins-compliance-quote-service
    profiles: [services]
    <<: *service-common
    ports:
      - "127.0.0.1:${COMPLIANCE_QUOTE_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  blockchain-service:
    build:
      context: ./services
      dockerfile: blockchain-service/Dockerfile
    image: stablecoins/blockchain-service:latest
    container_name: stablecoins-blockchain-service
    profiles: [services]
    <<: *service-common
    environment:
      <<: *service-environment
      # Local testnet signing key is passed only to this container.
      BLOCKCHAIN_WALLET_PRIVATE_KEY:
    ports:
      - "127.0.0.1:${BLOCKCHAIN_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  settlement-ledger-service:
    build:
      context: ./services
      dockerfile: settlement-ledger-service/Dockerfile
    image: stablecoins/settlement-ledger-service:latest
    container_name: stablecoins-settlement-ledger-service
    profiles: [services]
    <<: *service-common
    ports:
      - "127.0.0.1:${SETTLEMENT_LEDGER_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  reconciliation-service:
    build:
      context: ./services
      dockerfile: reconciliation-service/Dockerfile
    image: stablecoins/reconciliation-service:latest
    container_name: stablecoins-reconciliation-service
    profiles: [services]
    <<: *service-common
    ports:
      - "127.0.0.1:${RECONCILIATION_SERVICE_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  visa-simulator:
    build:
      context: ./services
      dockerfile: visa-simulator/Dockerfile
    image: stablecoins/visa-simulator:latest
    container_name: stablecoins-visa-simulator
    profiles: [services]
    <<: *service-common
    ports:
      # Internal VPC only in production (ADR-009). Port exposed locally for dev.
      - "127.0.0.1:${VISA_SIMULATOR_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  postgres-data:
    driver: local
  localstack-data:
    driver: local

networks:
  stablecoins-net:
    driver: bridge
