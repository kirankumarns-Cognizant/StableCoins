version: "3.9"

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Stablecoin Intelligent Payment Orchestration POC â€” Local Development Compose
#
# Usage:
#   # Infrastructure only (database + LocalStack):
#   docker compose up
#
#   # Infrastructure + all application services:
#   docker compose --profile services up --build
#
#   # Single application service:
#   docker compose --profile services up --build payment-service
#
# Environment:
#   Copy .env.example to .env and set DB_PASSWORD before running.
#   NEVER commit .env to source control.
#
# See ADR-010: Testcontainers + LocalStack for integration tests.
# Application services run via Spring Boot in integration tests.
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

x-service-common: &service-common
  networks:
    - stablecoins-net
  environment: &service-environment
    SPRING_PROFILES_ACTIVE: local
    # One history per owner in the dedicated local shared schema (ADR-007).
    LOCAL_SCHEMA_BOOTSTRAP: "true"
    DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${DB_NAME:-stablecoin_poc}}
    DB_USER: ${DB_USER:-${DB_USERNAME:-stablecoin}}
    DB_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    LOCALSTACK_URL: ${LOCALSTACK_URL:-http://localstack:4566}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    BLOCKCHAIN_MODE: MOCK
    TESTNET_ENABLED: "false"
    PAYMENT_SERVICE_PORT: "8080"
    COMPLIANCE_QUOTE_SERVICE_PORT: "8081"
    BLOCKCHAIN_SERVICE_PORT: "8082"
    SETTLEMENT_LEDGER_SERVICE_PORT: "8083"
    RECONCILIATION_SERVICE_PORT: "8084"
    VISA_SIMULATOR_PORT: "8086"
    PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8080}
    COMPLIANCE_QUOTE_SERVICE_URL: ${COMPLIANCE_QUOTE_SERVICE_URL:-http://compliance-quote-service:8081}
    BLOCKCHAIN_SERVICE_URL: ${BLOCKCHAIN_SERVICE_URL:-http://blockchain-service:8082}
    SETTLEMENT_LEDGER_SERVICE_URL: ${SETTLEMENT_LEDGER_SERVICE_URL:-http://settlement-ledger-service:8083}
    RECONCILIATION_SERVICE_URL: ${RECONCILIATION_SERVICE_URL:-http://reconciliation-service:8084}
    VISA_SIMULATOR_INTERNAL_URL: ${VISA_SIMULATOR_INTERNAL_URL:-http://visa-simulator:8086}
    # Optional overrides are omitted when unset, preserving shared-file defaults.
    SCHEDULING_POOL_SIZE:
    FLOW_SIMULATED_FX_USD:
    FLOW_SIMULATED_FX_INR:
    VISA_SIMULATOR_PAYOUT_SCENARIO:
    VISA_SIMULATOR_OPERATIONS_ENABLED:
